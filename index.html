<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>JARVIS — AI Assistant</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#02070d;color:#dff8ff}
body{display:flex;align-items:center;justify-content:center}
body:before{content:"";position:fixed;inset:0;background:
radial-gradient(circle at 50% 43%,rgba(0,210,255,.12),transparent 24%),
radial-gradient(circle at 50% 43%,rgba(0,110,255,.08),transparent 48%),
linear-gradient(rgba(0,190,255,.025) 1px,transparent 1px),
linear-gradient(90deg,rgba(0,190,255,.025) 1px,transparent 1px);
background-size:auto,auto,42px 42px,42px 42px;pointer-events:none}
.app{position:relative;width:100%;height:100%;max-width:1100px;padding:18px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;z-index:2}
.brand{letter-spacing:7px;font-weight:700;font-size:25px;text-shadow:0 0 18px #00d9ff}
.status{font-size:12px;letter-spacing:2px;color:#65eaff;display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:#42eaff;box-shadow:0 0 12px #42eaff}
.main{flex:1;display:flex;align-items:center;justify-content:center;position:relative}
.reactor{width:min(62vw,390px);height:min(62vw,390px);position:relative;display:flex;align-items:center;justify-content:center}
.ring{position:absolute;border:1px solid rgba(53,222,255,.45);border-radius:50%;box-shadow:0 0 25px rgba(0,196,255,.08),inset 0 0 25px rgba(0,196,255,.06)}
.r1{inset:2%;animation:spin 14s linear infinite}
.r2{inset:9%;border-style:dashed;animation:spin 20s linear infinite reverse}
.r3{inset:18%;border-color:rgba(72,235,255,.65);animation:spin 9s linear infinite}
.r4{inset:29%;border-width:2px;box-shadow:0 0 40px rgba(0,220,255,.25),inset 0 0 35px rgba(0,220,255,.15)}
.core{width:30%;height:30%;border-radius:50%;background:radial-gradient(circle,#fff 0%,#9df7ff 12%,#00d9ff 32%,#006a9a 56%,transparent 72%);box-shadow:0 0 35px #00e5ff,0 0 90px rgba(0,196,255,.5);animation:pulse 2s ease-in-out infinite}
.tick{position:absolute;width:100%;height:100%;border-radius:50%;border-top:2px solid #00eaff;animation:spin 4s linear infinite}
.innerText{position:absolute;bottom:3%;font-size:11px;letter-spacing:3px;color:#66eaff}
.panel{position:absolute;left:18px;right:18px;bottom:88px;max-width:650px;margin:auto;background:rgba(2,13,22,.78);border:1px solid rgba(58,218,255,.28);border-radius:15px;padding:12px 15px;backdrop-filter:blur(10px);z-index:3}
.log{height:48px;overflow:auto;font-size:13px;color:#a8dce8;line-height:1.45}
.log b{color:#55eaff}
.controls{display:flex;gap:12px;align-items:center;justify-content:center;z-index:4}
.mic{width:70px;height:70px;border-radius:50%;border:1px solid #43eaff;background:rgba(0,160,210,.12);color:#bffaff;font-size:27px;box-shadow:0 0 20px rgba(0,220,255,.2);cursor:pointer;transition:.2s}
.mic:active,.mic.listening{transform:scale(.94);background:rgba(0,220,255,.28);box-shadow:0 0 45px rgba(0,220,255,.55)}
.help{height:44px;padding:0 18px;border-radius:22px;border:1px solid rgba(75,220,255,.35);background:rgba(0,80,110,.14);color:#bdeff7;cursor:pointer}
.bottom{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:10px;letter-spacing:2px;color:#4c7f89}
@keyframes spin{to{transform:rotate(360deg)}} @keyframes pulse{50%{transform:scale(1.08);filter:brightness(1.25)}}
@media(max-width:600px){.app{padding:14px}.brand{font-size:20px;letter-spacing:5px}.panel{bottom:83px}.reactor{width:75vw;height:75vw}.mic{width:64px;height:64px}}

.modal{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(0,4,10,.88);backdrop-filter:blur(14px)}
.modalBox{width:min(430px,100%);padding:30px 24px;border:1px solid rgba(61,225,255,.5);border-radius:22px;background:linear-gradient(145deg,rgba(5,25,38,.98),rgba(2,10,18,.98));box-shadow:0 0 55px rgba(0,210,255,.18);text-align:center}
.modalIcon{font-size:48px;margin-bottom:12px;filter:drop-shadow(0 0 12px #00d9ff)}
.modalTitle{font-size:21px;font-weight:700;letter-spacing:2px;color:#dffbff}
.modalText{margin:14px 0 22px;color:#8fc4ce;font-size:14px;line-height:1.55}
.allowBtn{width:100%;height:50px;border:1px solid #46eaff;border-radius:25px;background:rgba(0,190,235,.16);color:#dfffff;font-weight:700;letter-spacing:1px;cursor:pointer;box-shadow:0 0 18px rgba(0,220,255,.18)}
.allowBtn:active{transform:scale(.98)}
.micHint{min-height:18px;margin-top:12px;font-size:11px;color:#6e9da7}

.textCommand{position:absolute;left:18px;right:18px;bottom:48px;max-width:560px;margin:auto;display:flex;gap:7px;z-index:4}
.textCommand input{flex:1;height:40px;border:1px solid rgba(61,220,255,.28);border-radius:20px;padding:0 15px;background:rgba(2,15,25,.7);color:#dffcff;outline:none}
.textCommand input::placeholder{color:#668d96}
.textCommand button{width:42px;border:1px solid rgba(61,220,255,.4);border-radius:50%;background:rgba(0,150,200,.14);color:#aef7ff;font-size:18px}
@media(max-width:600px){.textCommand{bottom:44px}.bottom{font-size:8px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">JARVIS</div>
    <div class="status"><span class="dot"></span><span id="status">ONLINE</span></div>
  </div>

  <div class="main">
    <div class="reactor" aria-label="JARVIS core">
      <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="ring r4"></div>
      <div class="tick"></div><div class="core"></div>
      <div class="innerText" id="mode">STANDBY</div>
    </div>
  </div>

  <div class="panel"><div class="log" id="log"><b>JARVIS:</b> Система готова. Нажмите микрофон и отдайте команду.</div></div>

  <div class="controls">
    <button class="help" id="help">КОМАНДЫ</button>
    <button class="mic" id="mic" aria-label="Голосовая команда">◉</button>
    <button class="help" id="clear">ОЧИСТИТЬ</button>
  </div>
  <div class="textCommand">
    <input id="commandInput" autocomplete="off" placeholder="Или напишите команду..." />
    <button id="sendCommand">➤</button>
  </div>
  <div class="bottom">JARVIS • OFFLINE MODE • NO WEB SEARCH</div>
</div>

<script>
const logEl=document.getElementById('log'), statusEl=document.getElementById('status'), modeEl=document.getElementById('mode'), mic=document.getElementById('mic');
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
let recognition=null;
const micModal=document.getElementById('micModal');
const allowMic=document.getElementById('allowMic');
const micHint=document.getElementById('micHint');

async function requestMicrophone(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    micHint.textContent='Браузер не поддерживает запрос микрофона.';
    return false;
  }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    stream.getTracks().forEach(t=>t.stop());
    micHint.textContent='Микрофон разрешён.';
    setTimeout(()=>micModal.style.display='none',350);
    return true;
  }catch(err){
    micHint.textContent='Доступ не разрешён. Разрешите микрофон в настройках сайта.';
    return false;
  }
}

function log(who,text){
  logEl.innerHTML += `<br><b>${who}:</b> ${escapeHtml(text)}`;
  logEl.scrollTop=logEl.scrollHeight;
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function speak(text){
  if('speechSynthesis' in window){
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='ru-RU';u.rate=.95;u.pitch=.9;
    speechSynthesis.speak(u);
  }
}
function answer(text){log('JARVIS',text);speak(text)}

function openSite(url,name){
  answer('Команда «'+name+'» сейчас работает в локальном режиме. Я не буду открывать браузер.');
}
function calculate(expr){
  const cleaned=expr.toLowerCase()
    .replace(/посчитать|посчитай|сколько будет|вычисли|равно/g,'')
    .replace(/умножить на|умножить/g,'*')
    .replace(/разделить на|разделить/g,'/')
    .replace(/плюс/g,'+').replace(/минус/g,'-')
    .replace(/(\d)\s*x\s*(\d)/g,'$1*$2').replace(/[^0-9+\-*/().\s]/g,'').trim();
  if(!cleaned)return null;
  try{
    if(!/^[0-9+\-*/().\s]+$/.test(cleaned))return null;
    const result=Function('"use strict";return ('+cleaned+')')();
    return Number.isFinite(result)?String(result):null;
  }catch(e){return null}
}

function execute(raw){
  const original=raw.trim();
  const cmd=original.toLowerCase();
  modeEl.textContent='PROCESSING';

  if(!original){
    answer('Я не услышал команду.');
  }else if(cmd.includes('привет')||cmd.includes('здравствуй')||cmd.includes('добрый')){
    answer('Здравствуйте. Я JARVIS. Система полностью готова к работе.');
  }else if(cmd.includes('который час')||cmd==='время'||cmd.includes('сколько времени')){
    const now=new Date();
    answer('Сейчас '+now.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}));
  }else if(cmd.includes('какая сегодня дата')||cmd.includes('какое сегодня число')||cmd==='дата'){
    answer('Сегодня '+new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})+'.');
  }else if(cmd.includes('как тебя зовут')||cmd.includes('кто ты')){
    answer('Я JARVIS, ваш локальный голосовой помощник. Я работаю прямо внутри этой страницы.');
  }else if(cmd.includes('что ты умеешь')||cmd.includes('команды')){
    answer('Я умею отвечать на простые вопросы, сообщать время и дату, считать, запоминать текст, показывать системные сведения и управлять интерфейсом. Интернет для ответов не используется.');
  }else if(cmd.includes('открой youtube')||cmd.includes('ютуб')||
          cmd.includes('открой google')||cmd.includes('гугл')||
          cmd.includes('открой github')||cmd.includes('гитхаб')||
          cmd.includes('открой telegram')||cmd.includes('телеграм')){
    answer('Я работаю в автономном режиме, поэтому никуда вас не перенаправляю.');
  }else if(cmd.includes('поиск')||cmd.includes('найди')){
    answer('Поиск в интернете отключён. Я не буду открывать браузер или отправлять вас на другие сайты.');
  }else if(cmd.includes('полный экран')||cmd.includes('полноэкран')){
    if(document.documentElement.requestFullscreen){
      document.documentElement.requestFullscreen().then(()=>answer('Полноэкранный режим включён.')).catch(()=>answer('Браузер не разрешил полноэкранный режим.'));
    }else answer('Полноэкранный режим недоступен в этом предпросмотре.');
  }else if(cmd.includes('выйди из полного экрана')){
    document.exitFullscreen?.();answer('Выход из полноэкранного режима.');
  }else if(cmd.includes('очисти')||cmd.includes('очистить')){
    logEl.innerHTML='<b>JARVIS:</b> Журнал очищен.';
    speak('Журнал очищен.');
  }else if(cmd.includes('запомни')){
    const memory=original.replace(/.*?запомни\s*/i,'').trim();
    if(memory){
      localStorage.setItem('jarvisMemory',memory);
      answer('Запомнил. Эта информация сохранена локально на этом устройстве.');
    }else answer('Скажите, что именно нужно запомнить.');
  }else if(cmd.includes('что ты запомнил')||cmd.includes('моя память')){
    const m=localStorage.getItem('jarvisMemory');
    answer(m?'Я помню: '+m:'Моя локальная память пока пуста.');
  }else if(cmd.includes('забудь')){
    localStorage.removeItem('jarvisMemory');
    answer('Локальная память очищена.');
  }else if(cmd.includes('кто создал тебя')||cmd.includes('кто тебя создал')){
    answer('Я создан как демонстрационный локальный JARVIS для этой страницы.');
  }else if(cmd.includes('спасибо')){
    answer('Пожалуйста. Всегда готов.');
  }else{
    const result=calculate(cmd);
    if(result!==null) answer('Результат: '+result);
    else answer('Я пока не знаю, как ответить на эту команду. Но я не буду открывать браузер или искать в интернете.');
  }
  setTimeout(()=>modeEl.textContent='STANDBY',700);
}
if(SpeechRecognition){
  recognition=new SpeechRecognition();
  recognition.lang='ru-RU';recognition.interimResults=false;recognition.continuous=false;
  recognition.onstart=()=>{mic.classList.add('listening');statusEl.textContent='LISTENING';modeEl.textContent='LISTENING';log('SYSTEM','Слушаю...')};
  recognition.onresult=e=>{const text=e.results[0][0].transcript;log('YOU',text);execute(text)};
  recognition.onerror=e=>{log('SYSTEM','Не удалось распознать команду.');statusEl.textContent='ONLINE';modeEl.textContent='STANDBY'};
  recognition.onend=()=>{mic.classList.remove('listening');statusEl.textContent='ONLINE';if(modeEl.textContent==='LISTENING')modeEl.textContent='STANDBY'};
}else{
  statusEl.textContent='NO VOICE API';
}
mic.onclick=()=>{
  if(!recognition){answer('Этот браузер не поддерживает голосовое распознавание. Попробуйте Chrome.');return}
  try{recognition.start()}catch(e){}
};
document.getElementById('clear').onclick=()=>{logEl.innerHTML='<b>JARVIS:</b> Журнал очищен.'};
document.getElementById('help').onclick=()=>{
  const text='Доступные команды: открой YouTube, открой Google, открой GitHub, открой Telegram, найди что-нибудь, который час, посчитай выражение, полный экран, запомни текст, что ты запомнил.';
  log('JARVIS',text);speak(text);
};
</script>

<div id="micModal" class="modal">
  <div class="modalBox">
    <div class="modalIcon">🎙️</div>
    <div class="modalTitle">Доступ к микрофону</div>
    <div class="modalText">JARVIS использует микрофон, чтобы слышать ваши голосовые команды.</div>
    <button id="allowMic" class="allowBtn">РАЗРЕШИТЬ МИКРОФОН</button>
    <div id="micHint" class="micHint">Нажмите кнопку, чтобы продолжить.</div>
  </div>
</div>
</body>
</html>
